[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.3.2"
description = "Auditable, open-source literature discovery and citation verification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Research Agent contributors"}]
dependencies = ["pypdf>=5,<7"]

[project.scripts]
research-agent = "ai_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
